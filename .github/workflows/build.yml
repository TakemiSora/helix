name: Build Helix Steel ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "ndk;27.2.12479018"

      - name: Configure Android toolchain
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Build
        run: cargo xtask steel

      - name: Collect binaries
        run: |
          mkdir artifacts
          cp ~/.cargo/bin/hx artifacts/
          cp ~/.cargo/bin/steel artifacts/
          cp ~/.cargo/bin/forge artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: helix-steel-arm64
          path: artifacts/