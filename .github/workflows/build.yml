name: Build Helix Steel ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ARM64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
        
      - name: Build
        run: |
          rustup add target aarch64-linux-android
          cargo xtask steel

      - name: Collect binaries
        run: |
          mkdir artifacts
          cp target/aarch64-linux-android/release/hx artifacts/
          cp ~/.cargo/bin/steel artifacts/
          cp ~/.cargo/bin/forge artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: helix-steel-arm64
          path: artifacts/
